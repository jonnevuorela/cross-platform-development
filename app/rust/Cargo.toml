[package]
name = "rust_lib_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["half"] }
tokenizers = "0.23.1"
once_cell = "1.19.0"
half = "2.4.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
